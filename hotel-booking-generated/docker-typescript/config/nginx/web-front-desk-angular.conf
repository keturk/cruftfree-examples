# Generated by CruftFree -- do not edit manually
#
# One nginx server block per (app, web target) static site. Every header
# below comes verbatim from the one shared
# security-header set (cruftfree_codegen_kernel.platform.web_security_headers) --
# never a second, hand-written header list. Routing is the app's one routing
# plan (cruftfree_codegen_kernel.platform.web_route_plan):
# SPA routing is scoped to the app's own declared page paths: a declared path
# serves index.html at 200; any other path also serves index.html's content (so
# the SPA's own `fallback` page still renders client-side) but at 404, via
# error_page, so a crawler or health probe sees the correct status.
#
# nginx inherits add_header from the enclosing level ONLY when a location
# declares none of its own, so every location that sets Cache-Control
# repeats the whole security-header set -- otherwise index.html, the runtime
# config and every hashed asset would be served without it.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Every redirect nginx answers (a declared one, or a directory's trailing
    # slash) carries a relative Location. The container listens on port 80 but is
    # reached on a published port, so an absolute Location would send the browser
    # to a host and port the site is not served on.
    absolute_redirect off;

    # Every file is served with the media type the shared table declares for its
    # extension (cruftfree_codegen_kernel.platform.web_route_plan.WEB_CONTENT_TYPES):
    # a type is never guessed, and an AVIF or WebP image is an image.
    default_type application/octet-stream;
    types {
        text/html html;
        text/css css;
        text/javascript js mjs;
        application/json json map;
        text/plain txt;
        application/xml xml;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/gif gif;
        image/webp webp;
        image/avif avif;
        image/vnd.microsoft.icon ico;
        font/woff woff;
        font/woff2 woff2;
        font/ttf ttf;
        font/otf otf;
    }

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:8080 http://localhost:8085; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' http://localhost:8085; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=()" always;

    # Content-hashed build output never changes under one filename -- safe
    # to cache forever.
    location ~* \.(js|mjs|css|svg|png|jpg|jpeg|webp|avif|gif|ico|woff|woff2|ttf|otf|map)$ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:8080 http://localhost:8085; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' http://localhost:8085; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=()" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html and runtime-config.json are the two files a redeploy
    # overwrites in place -- a client must always revalidate them.
    location = /index.html {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:8080 http://localhost:8085; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' http://localhost:8085; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=()" always;
        add_header Cache-Control "no-cache" always;
    }

    # The DEPLOYED runtime config: composed by the deploy's clients step
    # (late-bound client id resolved) into a read-only mount, never the
    # generated file.
    location = /runtime-config.json {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://localhost:8080 http://localhost:8085; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' http://localhost:8085; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=()" always;
        add_header Cache-Control "no-cache" always;
        alias /cruftfree-runtime-config/client-runtime-front-desk-angular.test.json;
    }

    # Every declared page path renders the SPA shell at 200.
    location ~ ^/$|^/auth/callback$|^/auth/forbidden$|^/auth/login$|^/auth/logout$|^/calendar$|^/channel$|^/charges$|^/housekeeping$|^/notices$|^/outbox$|^/room\-types$|^/room\-types/[^/]+$|^/room\-types/[^/]+/edit$|^/room\-types/new$|^/stays$|^/stays/[^/]+$ {
        try_files $uri /index.html;
    }

    # Anything else is unknown to the app's own router: serve the SPA shell
    # (so its `fallback` page still renders client-side) but at 404.
    location / {
        try_files $uri @cruftfree_unmatched;
    }

    location @cruftfree_unmatched {
        return 404;
    }

    error_page 404 /index.html;
}
