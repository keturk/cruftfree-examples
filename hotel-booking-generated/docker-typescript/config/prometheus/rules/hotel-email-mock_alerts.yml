groups:
  - name: hotel-email-mock-standard
    rules:
      - alert: HighErrorRate
        expr: sum(rate(http_errors_total{service="hotel-email-mock",status_code=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total{service="hotel-email-mock"}[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: critical
          service: hotel-email-mock
        annotations:
          summary: "High error rate on hotel-email-mock"
          description: "5xx error rate above 5% for 5 minutes."
      - alert: HighLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{service="hotel-email-mock"}[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
          service: hotel-email-mock
        annotations:
          summary: "High P95 latency on hotel-email-mock"
          description: "P95 latency above 2 seconds for 5 minutes."
      - alert: DatabaseConnectionPoolExhausted
        expr: sum(sqlalchemy_pool_checked_out{service="hotel-email-mock"}) / clamp_min(sum(sqlalchemy_pool_size{service="hotel-email-mock"}), 1) > 0.9
        for: 2m
        labels:
          severity: critical
          service: hotel-email-mock
        annotations:
          summary: "DB pool nearly exhausted on hotel-email-mock"
          description: "Checked-out connections exceed 90% of configured pool capacity."
