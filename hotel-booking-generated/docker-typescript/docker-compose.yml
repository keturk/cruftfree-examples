  access-hotel-stay-service-stay-db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: hotel-system-access-hotel-stay-service-stay-db
    environment:
      ACCESS_DB_HOST: hotel-system-postgresql
      ACCESS_DB_PORT: '5432'
      ACCESS_DB_USER: postgres
      ACCESS_DATABASE: hotel_stay
    volumes:
    - ./scripts/db-access:/db-access:ro
    secrets:
    - source: env__hotel_system_postgresql_postgres_password
      target: env__hotel_system_postgresql_postgres_password
    - source: env__hotel_stay_service_stay_db_owner_db_password
      target: env__hotel_stay_service_stay_db_owner_db_password
    - source: env__hotel_stay_service_stay_db_rw_db_password
      target: env__hotel_stay_service_stay_db_rw_db_password
    tmpfs:
    - /run/schema-credential:rw,noexec,nosuid,nodev,size=64k,mode=0700
    entrypoint:
    - sh
    - -c
    command:
    - 'umask 077; trap ''rm -f /run/schema-credential/credential'' EXIT; trap ''exit
      2'' HUP INT TERM; schema_credential=$$(cat /run/secrets/env__hotel_system_postgresql_postgres_password)
      || { echo ''The schema client''"''"''s credential could not be fetched.'' >&2;
      exit 2; }; [ -n "$$schema_credential" ] || { echo ''The schema client''"''"''s
      credential is empty: the block''"''"''s owner secret is not set.'' >&2; exit
      2; }; printf ''%s\n'' "$$schema_credential" | sed -e ''s/\\/\\\\/g'' -e ''s/:/\\:/g''
      -e ''s/^/*:*:*:*:/'' > /run/schema-credential/credential || { echo ''The schema
      client''"''"''s credential file could not be written.'' >&2; exit 2; }; unset
      schema_credential; [ "$$(wc -l < /run/schema-credential/credential)" -eq 1 ]
      || { echo ''The schema client''"''"''s credential holds a line break, which
      its file cannot.'' >&2; exit 2; }; export PGPASSFILE=/run/schema-credential/credential;
      HOTEL_STAY_SERVICE_STAY_DB_OWNER_DB_PASSWORD=$$(cat /run/secrets/env__hotel_stay_service_stay_db_owner_db_password)
      || { echo ''The secret HOTEL_STAY_SERVICE_STAY_DB_OWNER_DB_PASSWORD could not
      be fetched.'' >&2; exit 2; }; [ -n "$$HOTEL_STAY_SERVICE_STAY_DB_OWNER_DB_PASSWORD"
      ] || { echo ''The secret HOTEL_STAY_SERVICE_STAY_DB_OWNER_DB_PASSWORD is empty:
      its value is not set.'' >&2; exit 2; }; export HOTEL_STAY_SERVICE_STAY_DB_OWNER_DB_PASSWORD;
      HOTEL_STAY_SERVICE_STAY_DB_RW_DB_PASSWORD=$$(cat /run/secrets/env__hotel_stay_service_stay_db_rw_db_password)
      || { echo ''The secret HOTEL_STAY_SERVICE_STAY_DB_RW_DB_PASSWORD could not be
      fetched.'' >&2; exit 2; }; [ -n "$$HOTEL_STAY_SERVICE_STAY_DB_RW_DB_PASSWORD"
      ] || { echo ''The secret HOTEL_STAY_SERVICE_STAY_DB_RW_DB_PASSWORD is empty:
      its value is not set.'' >&2; exit 2; }; export HOTEL_STAY_SERVICE_STAY_DB_RW_DB_PASSWORD;
      psql -h "$$ACCESS_DB_HOST" -p "$$ACCESS_DB_PORT" -U "$$ACCESS_DB_USER" -d "$$ACCESS_DATABASE"
      -v ON_ERROR_STOP=1 -f /db-access/hotel-stay-service-stay-db.sql'
    depends_on:
      hotel-system-postgresql:
        condition: service_healthy
    healthcheck:
      disable: true
    cpu_shares: 1024
    networks:
    - database
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
