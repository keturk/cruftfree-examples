services:
  hotel-stay-service:
    build:
      context: ./hotel_stay_service
      dockerfile: Dockerfile
    image: hotel-stay-service:latest
    container_name: hotel-stay-service
    ports:
    - 127.0.0.1::8001
    environment:
      PORT: '8001'
      SERVICE_NAME: hotel-stay-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://hotel-system-jaeger:4318
      PAYMENT_PROVIDER_SERVICE_URL: http://hotel-payment-mock:8090
      payment_provider_api_key: ${payment_provider_api_key}
      CHANNEL_PROVIDER_SERVICE_URL: http://hotel-channel-mock:8092
      channel_provider_api_key: ${channel_provider_api_key}
      DEBUG: 'false'
      IDENTITY_MACHINE_CREDENTIALS_FILE: /machine-credentials/credentials.json
    depends_on:
      access-hotel-stay-service-stay-db:
        condition: service_completed_successfully
      hotel-system-postgresql:
        condition: service_healthy
      hotel-system-kafka:
        condition: service_healthy
      hotel-stay-service-mq-init:
        condition: service_completed_successfully
      hotel-system-jaeger:
        condition: service_healthy
      hotel-system-zitadel:
        condition: service_healthy
      hotel-system-zitadel-init:
        condition: service_completed_successfully
      hotel-stay-service-seed:
        condition: service_completed_successfully
      hotel-system-kafka-config-check:
        condition: service_completed_successfully
    volumes:
    - ./config/identity/identity-providers.json:/app/config/identity/identity-providers.json:ro
    - hotel-system-machine-credentials:/machine-credentials:ro
    - ./config/services/hotel-stay-service/config-store.json:/app/config/config-store.json:ro
    secrets:
    - source: hotel-stay-service__stay_db_password
      target: hotel_stay_service_stay_db_rw_password
    - source: hotel-stay-service__channel_provider_api_key
      target: channel_provider_api_key
    - source: hotel-stay-service__payment_provider_api_key
      target: payment_provider_api_key
    cpu_shares: 1024
    healthcheck:
      test:
      - CMD-SHELL
      - wget --quiet --tries=1 --spider http://localhost:8001/ready || exit 1
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
    - backend
    - broker
    - database
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  hotel-notice-service:
    build:
      context: ./hotel_notice_service
      dockerfile: Dockerfile
    image: hotel-notice-service:latest
    container_name: hotel-notice-service
    ports:
    - 127.0.0.1::8002
    environment:
      PORT: '8002'
      SERVICE_NAME: hotel-notice-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://hotel-system-jaeger:4318
      HOTEL_STAY_SERVICE_SERVICE_URL: http://hotel-stay-service:8001
      EMAIL_PROVIDER_SERVICE_URL: http://hotel-email-mock:8091
      email_provider_api_key: ${email_provider_api_key}
      DEBUG: 'false'
      IDENTITY_MACHINE_CREDENTIALS_FILE: /machine-credentials/credentials.json
    depends_on:
      access-hotel-notice-service-notice-db:
        condition: service_completed_successfully
      hotel-system-postgresql:
        condition: service_healthy
      hotel-system-kafka:
        condition: service_healthy
      hotel-system-jaeger:
        condition: service_healthy
      hotel-system-zitadel:
        condition: service_healthy
      hotel-system-zitadel-init:
        condition: service_completed_successfully
      hotel-system-kafka-config-check:
        condition: service_completed_successfully
    volumes:
    - ./config/identity/identity-providers.json:/app/config/identity/identity-providers.json:ro
    - hotel-system-machine-credentials:/machine-credentials:ro
    - ./config/services/hotel-notice-service/config-store.json:/app/config/config-store.json:ro
    secrets:
    - source: hotel-notice-service__notice_db_password
      target: hotel_notice_service_notice_db_rw_password
    - source: hotel-notice-service__email_provider_api_key
      target: email_provider_api_key
    cpu_shares: 1024
    healthcheck:
      test:
      - CMD-SHELL
      - wget --quiet --tries=1 --spider http://localhost:8002/ready || exit 1
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
    - backend
    - broker
    - database
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  hotel-payment-mock:
    build:
      context: ./hotel_payment_mock
      dockerfile: Dockerfile
    image: hotel-payment-mock:latest
    container_name: hotel-payment-mock
    ports:
    - 127.0.0.1::8090
    environment:
      PORT: '8090'
      SERVICE_NAME: hotel-payment-mock
      OTEL_EXPORTER_OTLP_ENDPOINT: http://hotel-system-jaeger:4318
      DEBUG: 'false'
      IDENTITY_MACHINE_CREDENTIALS_FILE: /machine-credentials/credentials.json
    depends_on:
      access-hotel-payment-mock-payment-db:
        condition: service_completed_successfully
      hotel-system-postgresql:
        condition: service_healthy
      hotel-system-jaeger:
        condition: service_healthy
      hotel-system-zitadel:
        condition: service_healthy
      hotel-system-zitadel-init:
        condition: service_completed_successfully
      hotel-payment-mock-seed:
        condition: service_completed_successfully
    volumes:
    - ./config/identity/identity-providers.json:/app/config/identity/identity-providers.json:ro
    - hotel-system-machine-credentials:/machine-credentials:ro
    - ./config/services/hotel-payment-mock/config-store.json:/app/config/config-store.json:ro
    secrets:
    - source: hotel-payment-mock__payment_db_password
      target: hotel_payment_mock_payment_db_rw_password
    cpu_shares: 1024
    healthcheck:
      test:
      - CMD-SHELL
      - wget --quiet --tries=1 --spider http://localhost:8090/ready || exit 1
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
    - backend
    - database
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  hotel-email-mock:
    build:
      context: ./hotel_email_mock
      dockerfile: Dockerfile
    image: hotel-email-mock:latest
    container_name: hotel-email-mock
    ports:
    - 127.0.0.1::8091
    environment:
      PORT: '8091'
      SERVICE_NAME: hotel-email-mock
      OTEL_EXPORTER_OTLP_ENDPOINT: http://hotel-system-jaeger:4318
      DEBUG: 'false'
      IDENTITY_MACHINE_CREDENTIALS_FILE: /machine-credentials/credentials.json
    depends_on:
      access-hotel-email-mock-email-db:
        condition: service_completed_successfully
      hotel-system-postgresql:
        condition: service_healthy
      hotel-system-jaeger:
        condition: service_healthy
      hotel-system-zitadel:
        condition: service_healthy
      hotel-system-zitadel-init:
        condition: service_completed_successfully
      hotel-email-mock-seed:
        condition: service_completed_successfully
    volumes:
    - ./config/identity/identity-providers.json:/app/config/identity/identity-providers.json:ro
    - hotel-system-machine-credentials:/machine-credentials:ro
    - ./config/services/hotel-email-mock/config-store.json:/app/config/config-store.json:ro
    secrets:
    - source: hotel-email-mock__email_db_password
      target: hotel_email_mock_email_db_rw_password
    cpu_shares: 1024
    healthcheck:
      test:
      - CMD-SHELL
      - wget --quiet --tries=1 --spider http://localhost:8091/ready || exit 1
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
    - backend
    - database
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  hotel-channel-mock:
    build:
      context: ./hotel_channel_mock
      dockerfile: Dockerfile
    image: hotel-channel-mock:latest
    container_name: hotel-channel-mock
    ports:
    - 127.0.0.1::8092
    environment:
      PORT: '8092'
      SERVICE_NAME: hotel-channel-mock
      OTEL_EXPORTER_OTLP_ENDPOINT: http://hotel-system-jaeger:4318
      DEBUG: 'false'
      IDENTITY_MACHINE_CREDENTIALS_FILE: /machine-credentials/credentials.json
    depends_on:
      access-hotel-channel-mock-channel-db:
        condition: service_completed_successfully
      hotel-system-postgresql:
        condition: service_healthy
      hotel-system-jaeger:
        condition: service_healthy
      hotel-system-zitadel:
        condition: service_healthy
      hotel-system-zitadel-init:
        condition: service_completed_successfully
      hotel-channel-mock-seed:
        condition: service_completed_successfully
    volumes:
    - ./config/identity/identity-providers.json:/app/config/identity/identity-providers.json:ro
    - hotel-system-machine-credentials:/machine-credentials:ro
    - ./config/services/hotel-channel-mock/config-store.json:/app/config/config-store.json:ro
    secrets:
    - source: hotel-channel-mock__channel_db_password
      target: hotel_channel_mock_channel_db_rw_password
    cpu_shares: 1024
    healthcheck:
      test:
      - CMD-SHELL
      - wget --quiet --tries=1 --spider http://localhost:8092/ready || exit 1
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
    - backend
    - database
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  hotel-system-postgresql:
    image: postgres:17-alpine
    container_name: hotel-system-postgresql
    ports:
    - 127.0.0.1::5432
    environment:
      POSTGRES_DB: hotel_stay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${HOTEL_SYSTEM_POSTGRESQL_POSTGRES_PASSWORD}
    volumes:
    - hotel-system-postgresql-data:/var/lib/postgresql/data
    - ./scripts/init-db/hotel-system-postgresql.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U $$POSTGRES_USER
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    cpu_shares: 1024
    networks:
    - database
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  hotel-system-kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: hotel-system-kafka
    ports:
    - 127.0.0.1:${HOTEL_SYSTEM_KAFKA_HOST_PORT:-29092}:29092
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@hotel-system-kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://hotel-system-kafka:9092,EXTERNAL://localhost:${HOTEL_SYSTEM_KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: '1'
      KAFKA_OFFSETS_TOPIC_SEGMENT_BYTES: '16777216'
      KAFKA_LOG_CLEANER_ENABLE: 'true'
      KAFKA_METADATA_LOG_SEGMENT_BYTES: '33554432'
      KAFKA_LOG_RETENTION_MS: '604800000'
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
    - hotel-system-kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 60s
    cpu_shares: 1024
    networks:
    - broker
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  hotel-stay-service-mq-init:
    image: confluentinc/cp-kafka:7.8.0
    container_name: hotel-stay-service-mq-init
    volumes:
    - ./scripts/init-topics:/scripts/init-topics:ro
    command:
    - /bin/bash
    - /scripts/init-topics/hotel-stay-service-mq.sh
    depends_on:
      hotel-system-kafka:
        condition: service_healthy
    healthcheck:
      disable: true
    cpu_shares: 1024
    networks:
    - broker
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  hotel-system-kafka-config-check:
    image: confluentinc/cp-kafka:7.8.0
    container_name: hotel-system-kafka-config-check
    volumes:
    - ./scripts/init-topics:/scripts/init-topics:ro
    command:
    - /bin/bash
    - /scripts/init-topics/hotel-system-kafka-broker-config.sh
    depends_on:
      hotel-system-kafka:
        condition: service_healthy
    healthcheck:
      disable: true
    cpu_shares: 1024
    networks:
    - broker
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  hotel-system-cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5@sha256:763aecf1c32c2be8a1a75f9abfc2fc461005c9dbbaa39cb356b354aac1296dbe
    container_name: hotel-system-cadvisor
    volumes:
    - /sys:/sys:ro
    - /proc:/rootfs/proc:ro
    - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    command:
    - --enable_metrics=app,cpu,cpuLoad,diskIO,memory,network,oom_event,percpu,perf_event
    - --docker=tcp://hotel-system-engine-api-proxy:2375
    depends_on:
      hotel-system-engine-api-proxy:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:8080/api/v1.3/docker/hotel-system-cadvisor
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpu_shares: 256
    networks:
    - engine-api
    - observability
    cap_add:
    - SYSLOG
    devices:
    - /dev/kmsg:/dev/kmsg:r
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  hotel-system-prometheus:
    image: prom/prometheus:v2.49.1@sha256:beb5e30ffba08d9ae8a7961b9a2145fc8af6296ff2a4f463df7cd722fcbfc789
    container_name: hotel-system-prometheus
    ports:
    - 127.0.0.1::9090
    volumes:
    - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./config/prometheus/rules:/etc/prometheus/rules:ro
    - prometheus-data:/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:9090/-/healthy
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpu_shares: 256
    networks:
    - backend
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  hotel-system-jaeger:
    image: jaegertracing/all-in-one:1.53@sha256:60e65bfffe1f66aee96d6fc8b6bf65afd42016be5dcc09d2e15d8462f7d9409c
    container_name: hotel-system-jaeger
    ports:
    - 127.0.0.1::16686
    - 127.0.0.1::14268
    - 127.0.0.1::4318
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    volumes:
    - ./config/jaeger/sampling_strategies.json:/etc/jaeger/sampling_strategies.json:ro
    command:
    - --sampling.strategies-file=/etc/jaeger/sampling_strategies.json
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:14269/
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpu_shares: 256
    networks:
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  hotel-system-loki:
    image: grafana/loki:2.9.10@sha256:35b02acc67654ddc38273e519b4f26f3967a907b9db5489af300c21f37ee1ae7
    container_name: hotel-system-loki
    ports:
    - 127.0.0.1::3100
    volumes:
    - loki-data:/loki
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpu_shares: 256
    networks:
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  hotel-system-promtail:
    image: grafana/promtail:2.9.10@sha256:63a2e57a5b1401109f77d36a49a637889d431280ed38f5f885eedcd3949e52cf
    container_name: hotel-system-promtail
    ports:
    - 127.0.0.1::9080
    volumes:
    - ./config/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
    command:
    - -config.file=/etc/promtail/config.yml
    depends_on:
      hotel-system-loki:
        condition: service_healthy
      hotel-system-engine-api-proxy:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - 'exec 3<>/dev/tcp/127.0.0.1/9080 && printf "GET /ready HTTP/1.1\r\nHost: localhost\r\nConnection:
        close\r\n\r\n" >&3 && head -1 <&3 | grep -q "200 OK"'
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpu_shares: 256
    networks:
    - engine-api
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  hotel-system-engine-api-proxy:
    image: python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159
    container_name: hotel-system-engine-api-proxy
    volumes:
    - ./config/engine-api-proxy/engine_api_proxy.py:/opt/cruftfree/engine_api_proxy.py:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
    - python
    - /opt/cruftfree/engine_api_proxy.py
    - serve
    healthcheck:
      test:
      - CMD
      - python
      - /opt/cruftfree/engine_api_proxy.py
      - probe
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpu_shares: 256
    networks:
    - engine-api
    cap_add:
    - NET_BIND_SERVICE
    cap_drop:
    - ALL
    read_only: true
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  hotel-system-alertmanager:
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    container_name: hotel-system-alertmanager
    ports:
    - 127.0.0.1::9093
    volumes:
    - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:9093/-/healthy || exit
        1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpu_shares: 256
    networks:
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  hotel-system-grafana:
    image: grafana/grafana:10.2.3@sha256:6b5b37eb35bbf30e7f64bd7f0fd41c0a5b7637f65d3bf93223b04a192b8bf3e2
    container_name: hotel-system-grafana
    ports:
    - 127.0.0.1::3000
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required
        -- set it in .env; Grafana must not run on a default account name}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD
        is required -- set it in .env; Grafana must not run on a default password}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: http://localhost:8080/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
    volumes:
    - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    - grafana-data:/var/lib/grafana
    depends_on:
      hotel-system-cadvisor:
        condition: service_started
      hotel-system-prometheus:
        condition: service_started
      hotel-system-jaeger:
        condition: service_started
      hotel-system-loki:
        condition: service_started
      hotel-system-promtail:
        condition: service_started
      hotel-system-engine-api-proxy:
        condition: service_started
      hotel-system-alertmanager:
        condition: service_started
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpu_shares: 256
    networks:
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  hotel-system-zitadel-db:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    container_name: hotel-system-zitadel-db
    environment:
      POSTGRES_DB: zitadel
      POSTGRES_USER: zitadel
      POSTGRES_PASSWORD: ${HOTEL_SYSTEM_ZITADEL_DB_PASSWORD}
    volumes:
    - hotel-system-zitadel-db-data:/var/lib/postgresql/data
    healthcheck:
