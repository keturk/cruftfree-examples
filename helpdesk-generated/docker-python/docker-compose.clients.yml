services:
  helpdesk-system-help-centre-angular-web-static-site:
    build:
      context: ./clients/angular/
      dockerfile: ../../config/web-static-site/help-centre-angular.dockerfile
    container_name: helpdesk-system-help-centre-angular-web-static-site
    ports:
    - 127.0.0.1:${HELPDESK_SYSTEM_HELP_CENTRE_ANGULAR_WEB_STATIC_SITE_HOST_PORT:-4200}:80
    volumes:
    - ./config/nginx/web-help-centre-angular.conf:/etc/nginx/conf.d/default.conf:ro
    - type: bind
      source: ./config/resolved
      target: /cruftfree-runtime-config
      read_only: true
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD
      - nginx
      - -t
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    cpu_shares: 1024
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  helpdesk-system-console-angular-web-static-site:
    build:
      context: ./clients/angular/
      dockerfile: ../../config/web-static-site/console-angular.dockerfile
    container_name: helpdesk-system-console-angular-web-static-site
    ports:
    - 127.0.0.1:${HELPDESK_SYSTEM_CONSOLE_ANGULAR_WEB_STATIC_SITE_HOST_PORT:-4300}:80
    volumes:
    - ./config/nginx/web-console-angular.conf:/etc/nginx/conf.d/default.conf:ro
    - type: bind
      source: ./config/resolved
      target: /cruftfree-runtime-config
      read_only: true
      bind:
        create_host_path: false
    healthcheck:
      test:
      - CMD
      - nginx
      - -t
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    cpu_shares: 1024
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
