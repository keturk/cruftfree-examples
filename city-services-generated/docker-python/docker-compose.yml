services:
  cityservices-district-service:
    build:
      context: ./cityservices_district_service
      dockerfile: Dockerfile
    image: cityservices-district-service:latest
    container_name: cityservices-district-service
    ports:
    - 127.0.0.1::8001
    environment:
      PORT: '8001'
      SERVICE_NAME: cityservices-district-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://cityservices-system-jaeger:4318
      DEBUG: 'false'
      IDENTITY_MACHINE_CREDENTIALS_FILE: /machine-credentials/credentials.json
    depends_on:
      access-cityservices-district-service-district-db:
        condition: service_completed_successfully
      cityservices-system-postgresql:
        condition: service_healthy
      cityservices-system-jaeger:
        condition: service_healthy
      cityservices-system-zitadel:
        condition: service_healthy
      cityservices-system-zitadel-init:
        condition: service_completed_successfully
      cityservices-district-service-seed:
        condition: service_completed_successfully
    volumes:
    - ./config/identity/identity-providers.json:/app/config/identity/identity-providers.json:ro
    - cityservices-system-machine-credentials:/machine-credentials:ro
    - ./config/services/cityservices-district-service/config-store.json:/app/config/config-store.json:ro
    secrets:
    - source: cityservices-district-service__district_db_password
      target: cityservices_district_service_district_db_rw_password
    cpu_shares: 1024
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8001/ready')"
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
    - backend
    - database
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  cityservices-facility-service:
    build:
      context: ./cityservices_facility_service
      dockerfile: Dockerfile
    image: cityservices-facility-service:latest
    container_name: cityservices-facility-service
    ports:
    - 127.0.0.1::8002
    environment:
      PORT: '8002'
      SERVICE_NAME: cityservices-facility-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://cityservices-system-jaeger:4318
      DEBUG: 'false'
      IDENTITY_MACHINE_CREDENTIALS_FILE: /machine-credentials/credentials.json
    depends_on:
      access-cityservices-facility-service-facility-db:
        condition: service_completed_successfully
      cityservices-system-postgresql:
        condition: service_healthy
      cityservices-system-jaeger:
        condition: service_healthy
      cityservices-system-zitadel:
        condition: service_healthy
      cityservices-system-zitadel-init:
        condition: service_completed_successfully
      cityservices-facility-service-seed:
        condition: service_completed_successfully
    volumes:
    - ./config/identity/identity-providers.json:/app/config/identity/identity-providers.json:ro
    - cityservices-system-machine-credentials:/machine-credentials:ro
    - ./config/services/cityservices-facility-service/config-store.json:/app/config/config-store.json:ro
    secrets:
    - source: cityservices-facility-service__facility_db_password
      target: cityservices_facility_service_facility_db_rw_password
    cpu_shares: 1024
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8002/ready')"
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
    - backend
    - database
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  cityservices-request-service:
    build:
      context: ./cityservices_request_service
      dockerfile: Dockerfile
    image: cityservices-request-service:latest
    container_name: cityservices-request-service
    ports:
    - 127.0.0.1::8003
    environment:
      PORT: '8003'
      SERVICE_NAME: cityservices-request-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://cityservices-system-jaeger:4318
      CITYSERVICES_DISTRICT_SERVICE_SERVICE_URL: http://cityservices-district-service:8001
      SMS_PROVIDER_SERVICE_URL: http://cityservices-sms-mock:8090
      sms_provider_api_key: ${sms_provider_api_key}
      GEOCODER_PROVIDER_SERVICE_URL: http://cityservices-geocoder-mock:8091
      geocoder_provider_api_key: ${geocoder_provider_api_key}
      DEBUG: 'false'
      IDENTITY_MACHINE_CREDENTIALS_FILE: /machine-credentials/credentials.json
    depends_on:
      access-cityservices-request-service-request-db:
        condition: service_completed_successfully
      cityservices-system-postgresql:
        condition: service_healthy
      cityservices-request-service-mq:
        condition: service_healthy
      cityservices-request-service-mq-init:
        condition: service_completed_successfully
      cityservices-system-jaeger:
        condition: service_healthy
      cityservices-system-zitadel:
        condition: service_healthy
      cityservices-system-zitadel-init:
        condition: service_completed_successfully
      cityservices-request-service-seed:
        condition: service_completed_successfully
      cityservices-request-service-mq-config-check:
        condition: service_completed_successfully
    volumes:
    - ./config/identity/identity-providers.json:/app/config/identity/identity-providers.json:ro
    - cityservices-system-machine-credentials:/machine-credentials:ro
    - ./config/services/cityservices-request-service/config-store.json:/app/config/config-store.json:ro
    secrets:
    - source: cityservices-request-service__request_db_password
      target: cityservices_request_service_request_db_rw_password
    - source: cityservices-request-service__geocoder_provider_api_key
      target: geocoder_provider_api_key
    - source: cityservices-request-service__sms_provider_api_key
      target: sms_provider_api_key
    cpu_shares: 1024
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8003/ready')"
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
    - backend
    - broker
    - database
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  cityservices-sms-mock:
    build:
      context: ./cityservices_sms_mock
      dockerfile: Dockerfile
    image: cityservices-sms-mock:latest
    container_name: cityservices-sms-mock
    ports:
    - 127.0.0.1::8090
    environment:
      PORT: '8090'
      SERVICE_NAME: cityservices-sms-mock
      OTEL_EXPORTER_OTLP_ENDPOINT: http://cityservices-system-jaeger:4318
      DEBUG: 'false'
      IDENTITY_MACHINE_CREDENTIALS_FILE: /machine-credentials/credentials.json
    depends_on:
      access-cityservices-sms-mock-sms-db:
        condition: service_completed_successfully
      cityservices-system-postgresql:
        condition: service_healthy
      cityservices-system-jaeger:
        condition: service_healthy
      cityservices-system-zitadel:
        condition: service_healthy
      cityservices-system-zitadel-init:
        condition: service_completed_successfully
      cityservices-sms-mock-seed:
        condition: service_completed_successfully
    volumes:
    - ./config/identity/identity-providers.json:/app/config/identity/identity-providers.json:ro
    - cityservices-system-machine-credentials:/machine-credentials:ro
    - ./config/services/cityservices-sms-mock/config-store.json:/app/config/config-store.json:ro
    secrets:
    - source: cityservices-sms-mock__sms_db_password
      target: cityservices_sms_mock_sms_db_rw_password
    cpu_shares: 1024
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8090/ready')"
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
    - backend
    - database
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  cityservices-geocoder-mock:
    build:
      context: ./cityservices_geocoder_mock
      dockerfile: Dockerfile
    image: cityservices-geocoder-mock:latest
    container_name: cityservices-geocoder-mock
    ports:
    - 127.0.0.1::8091
    environment:
      PORT: '8091'
      SERVICE_NAME: cityservices-geocoder-mock
      OTEL_EXPORTER_OTLP_ENDPOINT: http://cityservices-system-jaeger:4318
      DEBUG: 'false'
      IDENTITY_MACHINE_CREDENTIALS_FILE: /machine-credentials/credentials.json
    depends_on:
      access-cityservices-geocoder-mock-geocoder-db:
        condition: service_completed_successfully
      cityservices-system-postgresql:
        condition: service_healthy
      cityservices-system-jaeger:
        condition: service_healthy
      cityservices-system-zitadel:
        condition: service_healthy
      cityservices-system-zitadel-init:
        condition: service_completed_successfully
      cityservices-geocoder-mock-seed:
        condition: service_completed_successfully
    volumes:
    - ./config/identity/identity-providers.json:/app/config/identity/identity-providers.json:ro
    - cityservices-system-machine-credentials:/machine-credentials:ro
    - ./config/services/cityservices-geocoder-mock/config-store.json:/app/config/config-store.json:ro
    secrets:
    - source: cityservices-geocoder-mock__geocoder_db_password
      target: cityservices_geocoder_mock_geocoder_db_rw_password
    cpu_shares: 1024
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8091/ready')"
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
    - backend
    - database
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  cityservices-system-postgresql:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    container_name: cityservices-system-postgresql
    ports:
    - 127.0.0.1::5432
    environment:
      POSTGRES_DB: cityservices_district
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${CITYSERVICES_SYSTEM_POSTGRESQL_POSTGRES_PASSWORD}
    volumes:
    - cityservices-system-postgresql-data:/var/lib/postgresql/data
    - ./scripts/init-db/cityservices-system-postgresql.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U $$POSTGRES_USER
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    cpu_shares: 1024
    networks:
    - database
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  cityservices-request-service-mq:
    image: confluentinc/cp-kafka:7.8.0
    container_name: cityservices-request-service-mq
    ports:
    - 127.0.0.1:${CITYSERVICES_REQUEST_SERVICE_MQ_HOST_PORT:-29092}:29092
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@cityservices-request-service-mq:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://cityservices-request-service-mq:9092,EXTERNAL://localhost:${CITYSERVICES_REQUEST_SERVICE_MQ_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: '1'
      KAFKA_OFFSETS_TOPIC_SEGMENT_BYTES: '16777216'
      KAFKA_LOG_CLEANER_ENABLE: 'true'
      KAFKA_METADATA_LOG_SEGMENT_BYTES: '33554432'
      KAFKA_LOG_RETENTION_MS: '604800000'
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
    - cityservices-request-service-mq-data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 60s
    cpu_shares: 1024
    networks:
    - broker
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  cityservices-request-service-mq-init:
    image: confluentinc/cp-kafka:7.8.0
    container_name: cityservices-request-service-mq-init
    volumes:
    - ./scripts/init-topics:/scripts/init-topics:ro
    command:
    - /bin/bash
    - /scripts/init-topics/cityservices-request-service-mq.sh
    depends_on:
      cityservices-request-service-mq:
        condition: service_healthy
    healthcheck:
      disable: true
    cpu_shares: 1024
    networks:
    - broker
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  cityservices-request-service-mq-config-check:
    image: confluentinc/cp-kafka:7.8.0
    container_name: cityservices-request-service-mq-config-check
    volumes:
    - ./scripts/init-topics:/scripts/init-topics:ro
    command:
    - /bin/bash
    - /scripts/init-topics/cityservices-request-service-mq-broker-config.sh
    depends_on:
      cityservices-request-service-mq:
        condition: service_healthy
    healthcheck:
      disable: true
    cpu_shares: 1024
    networks:
    - broker
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  cityservices-system-cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5@sha256:763aecf1c32c2be8a1a75f9abfc2fc461005c9dbbaa39cb356b354aac1296dbe
    container_name: cityservices-system-cadvisor
    volumes:
    - /sys:/sys:ro
    - /proc:/rootfs/proc:ro
    - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    command:
    - --enable_metrics=app,cpu,cpuLoad,diskIO,memory,network,oom_event,percpu,perf_event
    - --docker=tcp://cityservices-system-engine-api-proxy:2375
    depends_on:
      cityservices-system-engine-api-proxy:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:8080/api/v1.3/docker/cityservices-system-cadvisor
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpu_shares: 256
    networks:
    - engine-api
    - observability
    cap_add:
    - SYSLOG
    devices:
    - /dev/kmsg:/dev/kmsg:r
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  cityservices-system-prometheus:
    image: prom/prometheus:v2.49.1@sha256:beb5e30ffba08d9ae8a7961b9a2145fc8af6296ff2a4f463df7cd722fcbfc789
    container_name: cityservices-system-prometheus
    ports:
    - 127.0.0.1::9090
    volumes:
    - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./config/prometheus/rules:/etc/prometheus/rules:ro
    - prometheus-data:/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:9090/-/healthy
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpu_shares: 256
    networks:
    - backend
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  cityservices-system-jaeger:
    image: jaegertracing/all-in-one:1.53@sha256:60e65bfffe1f66aee96d6fc8b6bf65afd42016be5dcc09d2e15d8462f7d9409c
    container_name: cityservices-system-jaeger
    ports:
    - 127.0.0.1::16686
    - 127.0.0.1::14268
    - 127.0.0.1::4318
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    volumes:
    - ./config/jaeger/sampling_strategies.json:/etc/jaeger/sampling_strategies.json:ro
    command:
    - --sampling.strategies-file=/etc/jaeger/sampling_strategies.json
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:14269/
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpu_shares: 256
    networks:
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  cityservices-system-loki:
    image: grafana/loki:2.9.10@sha256:35b02acc67654ddc38273e519b4f26f3967a907b9db5489af300c21f37ee1ae7
    container_name: cityservices-system-loki
    ports:
    - 127.0.0.1::3100
    volumes:
    - loki-data:/loki
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpu_shares: 256
    networks:
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  cityservices-system-promtail:
    image: grafana/promtail:2.9.10@sha256:63a2e57a5b1401109f77d36a49a637889d431280ed38f5f885eedcd3949e52cf
    container_name: cityservices-system-promtail
    ports:
    - 127.0.0.1::9080
    volumes:
    - ./config/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
    command:
    - -config.file=/etc/promtail/config.yml
    depends_on:
      cityservices-system-loki:
        condition: service_healthy
      cityservices-system-engine-api-proxy:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - 'exec 3<>/dev/tcp/127.0.0.1/9080 && printf "GET /ready HTTP/1.1\r\nHost: localhost\r\nConnection:
        close\r\n\r\n" >&3 && head -1 <&3 | grep -q "200 OK"'
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpu_shares: 256
    networks:
    - engine-api
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  cityservices-system-engine-api-proxy:
    image: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    container_name: cityservices-system-engine-api-proxy
    volumes:
    - ./config/engine-api-proxy/engine_api_proxy.py:/opt/cruftfree/engine_api_proxy.py:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
    - python
    - /opt/cruftfree/engine_api_proxy.py
    - serve
    healthcheck:
      test:
      - CMD
      - python
      - /opt/cruftfree/engine_api_proxy.py
      - probe
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpu_shares: 256
    networks:
    - engine-api
    cap_add:
    - NET_BIND_SERVICE
    cap_drop:
    - ALL
    read_only: true
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  cityservices-system-alertmanager:
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    container_name: cityservices-system-alertmanager
    ports:
    - 127.0.0.1::9093
    volumes:
    - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:9093/-/healthy || exit
        1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpu_shares: 256
    networks:
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  cityservices-system-grafana:
    image: grafana/grafana:10.2.3@sha256:6b5b37eb35bbf30e7f64bd7f0fd41c0a5b7637f65d3bf93223b04a192b8bf3e2
    container_name: cityservices-system-grafana
    ports:
    - 127.0.0.1::3000
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required
        -- set it in .env; Grafana must not run on a default account name}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD
        is required -- set it in .env; Grafana must not run on a default password}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SERVER_ROOT_URL: http://localhost:8080/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
    volumes:
    - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    - grafana-data:/var/lib/grafana
    depends_on:
      cityservices-system-cadvisor:
        condition: service_started
      cityservices-system-prometheus:
        condition: service_started
      cityservices-system-jaeger:
        condition: service_started
      cityservices-system-loki:
        condition: service_started
      cityservices-system-promtail:
        condition: service_started
      cityservices-system-engine-api-proxy:
        condition: service_started
      cityservices-system-alertmanager:
        condition: service_started
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpu_shares: 256
    networks:
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  cityservices-system-zitadel-db:
    image: postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    container_name: cityservices-system-zitadel-db
    environment:
