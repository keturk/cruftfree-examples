# Azure DevOps CI/CD Pipeline
# Generated by CruftFree -- do not edit manually

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - 'infra/*'
      - 'realestate_listing_service/*'
      - 'realestate_viewing_service/*'
      - 'realestate_deal_service/*'
      - 'realestate_mortgage_mock/*'
      - 'realestate_signature_mock/*'
      - 'realestate_email_mock/*'
      # Shared per-system base image of one service language: its requirements
      # are the union of those services', so a change here re-tags the base AND
      # every service image built FROM it. Emitted only for a language with a
      # shared base-image family (LanguageRuntimeSpec.shared_base_image).
      - 'typescript-base/*'

pr:
  branches:
    include:
      - main

variables:
  - group: 'realestate.System-variables'
  - name: azureSubscription
    value: 'realestate-system-azure-connection'
  - name: resourceGroup
    value: 'realestate-system-dev-rg'
  - name: location
    value: 'eastus'

stages:
  - stage: Build
    displayName: 'Build & Test'
    jobs:
      - job: BuildAndTest
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          # realestate.ListingService: its language's CI plan -- the toolchain the
          # service deploys on, then the plan's own install and test commands.
          - task: NodeTool@0
            inputs:
              versionSpec: '22'
            displayName: 'Set up realestate.ListingService toolchain 22'

          - script: |
              cd realestate_listing_service
              corepack enable
              pnpm install --ignore-workspace --no-frozen-lockfile
              pnpm run test
            displayName: 'Test realestate.ListingService'

          # realestate.ViewingService: its language's CI plan -- the toolchain the
          # service deploys on, then the plan's own install and test commands.
          - task: NodeTool@0
            inputs:
              versionSpec: '22'
            displayName: 'Set up realestate.ViewingService toolchain 22'

          - script: |
              cd realestate_viewing_service
              corepack enable
              pnpm install --ignore-workspace --no-frozen-lockfile
              pnpm run test
            displayName: 'Test realestate.ViewingService'

          # realestate.DealService: its language's CI plan -- the toolchain the
          # service deploys on, then the plan's own install and test commands.
          - task: NodeTool@0
            inputs:
              versionSpec: '22'
            displayName: 'Set up realestate.DealService toolchain 22'

          - script: |
              cd realestate_deal_service
              corepack enable
              pnpm install --ignore-workspace --no-frozen-lockfile
              pnpm run test
            displayName: 'Test realestate.DealService'

          # realestate.MortgageMock: its language's CI plan -- the toolchain the
          # service deploys on, then the plan's own install and test commands.
          - task: NodeTool@0
            inputs:
              versionSpec: '22'
            displayName: 'Set up realestate.MortgageMock toolchain 22'

          - script: |
              cd realestate_mortgage_mock
              corepack enable
              pnpm install --ignore-workspace --no-frozen-lockfile
              pnpm run test
            displayName: 'Test realestate.MortgageMock'

          # realestate.SignatureMock: its language's CI plan -- the toolchain the
          # service deploys on, then the plan's own install and test commands.
          - task: NodeTool@0
            inputs:
              versionSpec: '22'
            displayName: 'Set up realestate.SignatureMock toolchain 22'

          - script: |
              cd realestate_signature_mock
              corepack enable
              pnpm install --ignore-workspace --no-frozen-lockfile
              pnpm run test
            displayName: 'Test realestate.SignatureMock'

          # realestate.EmailMock: its language's CI plan -- the toolchain the
          # service deploys on, then the plan's own install and test commands.
          - task: NodeTool@0
            inputs:
              versionSpec: '22'
            displayName: 'Set up realestate.EmailMock toolchain 22'

          - script: |
              cd realestate_email_mock
              corepack enable
              pnpm install --ignore-workspace --no-frozen-lockfile
              pnpm run test
            displayName: 'Test realestate.EmailMock'

  - stage: DeployProd
    displayName: 'Deploy to dev'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployProd
        environment: 'dev'
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                # A `deployment` job does NOT check out sources by default (unlike
                # a regular job), so this step is required, not incidental -- the
                # deploy script resolves every path it touches (infra/*, scripts/*,
                # each service's sources) relative to the repository.
                - checkout: self
                  displayName: 'Check out sources'

                # The deploy script builds each package on its language's own
                # toolchain (the packaging build steps), so the toolchains the
                # services declare are installed here too.
                - task: NodeTool@0
                  inputs:
                    versionSpec: '22'
                  displayName: 'Set up toolchain 22'

                - script: |
                    corepack enable
                  displayName: 'Prepare toolchain 22'

                # scripts/deploy.sh activates the project virtual environment and
                # runs scripts/deploy.py, the ONE source of truth for the rollout in
                # both delivery modes: the staged foundation -> full infrastructure
                # deploy; ACR login, base + per-service image
                # build/push (content-hash tagged, skipped when the tag already exists
                # in the registry) and the placeholder -> resolved-tag rewrite into the
                # .bicepparam BEFORE any Bicep stage; and each Function App, packaged
                # from its language's FunctionAppPackaging. CI delegates rather than
                # restating the sequence in YAML, so the pipeline and the documented
                # manual path (DEPLOYMENT.md) cannot drift and no package is built
                # two ways.
                #
                # Passwordless deploy: every Postgres datasource uses Entra AD auth,
                # so no admin-password secret is wired into this task. AzureCLI@2
                # provides the authenticated `az` session the deployment's own
                # login check expects.
                - task: AzureCLI@2
                  inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: bash scripts/deploy.sh deploy
                  env:
                    RESOURCE_GROUP: $(resourceGroup)
                    LOCATION: $(location)
                    ENVIRONMENT: dev
                  displayName: 'Deploy realestate.System to dev'
