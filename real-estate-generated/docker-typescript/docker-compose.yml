    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: realestate-system-access-realestate-listing-service-listing-db
    environment:
      ACCESS_DB_HOST: realestate-system-postgresql
      ACCESS_DB_PORT: '5432'
      ACCESS_DB_USER: postgres
      ACCESS_DATABASE: realestate_listing
    volumes:
    - ./scripts/db-access:/db-access:ro
    secrets:
    - source: env__realestate_system_postgresql_postgres_password
      target: env__realestate_system_postgresql_postgres_password
    - source: env__realestate_listing_service_listing_db_owner_db_password
      target: env__realestate_listing_service_listing_db_owner_db_password
    - source: env__realestate_listing_service_listing_db_rw_db_password
      target: env__realestate_listing_service_listing_db_rw_db_password
    tmpfs:
    - /run/schema-credential:rw,noexec,nosuid,nodev,size=64k,mode=0700
    entrypoint:
    - sh
    - -c
    command:
    - 'umask 077; trap ''rm -f /run/schema-credential/credential'' EXIT; trap ''exit
      2'' HUP INT TERM; schema_credential=$$(cat /run/secrets/env__realestate_system_postgresql_postgres_password)
      || { echo ''The schema client''"''"''s credential could not be fetched.'' >&2;
      exit 2; }; [ -n "$$schema_credential" ] || { echo ''The schema client''"''"''s
      credential is empty: the block''"''"''s owner secret is not set.'' >&2; exit
      2; }; printf ''%s\n'' "$$schema_credential" | sed -e ''s/\\/\\\\/g'' -e ''s/:/\\:/g''
      -e ''s/^/*:*:*:*:/'' > /run/schema-credential/credential || { echo ''The schema
      client''"''"''s credential file could not be written.'' >&2; exit 2; }; unset
      schema_credential; [ "$$(wc -l < /run/schema-credential/credential)" -eq 1 ]
      || { echo ''The schema client''"''"''s credential holds a line break, which
      its file cannot.'' >&2; exit 2; }; export PGPASSFILE=/run/schema-credential/credential;
      REALESTATE_LISTING_SERVICE_LISTING_DB_OWNER_DB_PASSWORD=$$(cat /run/secrets/env__realestate_listing_service_listing_db_owner_db_password)
      || { echo ''The secret REALESTATE_LISTING_SERVICE_LISTING_DB_OWNER_DB_PASSWORD
      could not be fetched.'' >&2; exit 2; }; [ -n "$$REALESTATE_LISTING_SERVICE_LISTING_DB_OWNER_DB_PASSWORD"
      ] || { echo ''The secret REALESTATE_LISTING_SERVICE_LISTING_DB_OWNER_DB_PASSWORD
      is empty: its value is not set.'' >&2; exit 2; }; export REALESTATE_LISTING_SERVICE_LISTING_DB_OWNER_DB_PASSWORD;
      REALESTATE_LISTING_SERVICE_LISTING_DB_RW_DB_PASSWORD=$$(cat /run/secrets/env__realestate_listing_service_listing_db_rw_db_password)
      || { echo ''The secret REALESTATE_LISTING_SERVICE_LISTING_DB_RW_DB_PASSWORD
      could not be fetched.'' >&2; exit 2; }; [ -n "$$REALESTATE_LISTING_SERVICE_LISTING_DB_RW_DB_PASSWORD"
      ] || { echo ''The secret REALESTATE_LISTING_SERVICE_LISTING_DB_RW_DB_PASSWORD
      is empty: its value is not set.'' >&2; exit 2; }; export REALESTATE_LISTING_SERVICE_LISTING_DB_RW_DB_PASSWORD;
      psql -h "$$ACCESS_DB_HOST" -p "$$ACCESS_DB_PORT" -U "$$ACCESS_DB_USER" -d "$$ACCESS_DATABASE"
      -v ON_ERROR_STOP=1 -f /db-access/realestate-listing-service-listing-db.sql'
    depends_on:
      realestate-system-postgresql:
        condition: service_healthy
