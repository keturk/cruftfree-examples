        condition: service_healthy
      realestate-system-jaeger:
        condition: service_healthy
      realestate-system-zitadel:
        condition: service_healthy
      realestate-system-zitadel-init:
        condition: service_completed_successfully
      realestate-signature-mock-seed:
        condition: service_completed_successfully
    volumes:
    - ./config/identity/identity-providers.json:/app/config/identity/identity-providers.json:ro
    - realestate-system-machine-credentials:/machine-credentials:ro
    - ./config/services/realestate-signature-mock/config-store.json:/app/config/config-store.json:ro
    secrets:
    - source: realestate-signature-mock__signature_db_password
      target: realestate_signature_mock_signature_db_rw_password
    cpu_shares: 1024
    healthcheck:
      test:
      - CMD-SHELL
      - wget --quiet --tries=1 --spider http://localhost:8091/ready || exit 1
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
    - backend
    - database
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  realestate-email-mock:
    build:
      context: ./realestate_email_mock
      dockerfile: Dockerfile
    image: realestate-email-mock:latest
    container_name: realestate-email-mock
    ports:
    - 127.0.0.1::8092
    environment:
      PORT: '8092'
      SERVICE_NAME: realestate-email-mock
      OTEL_EXPORTER_OTLP_ENDPOINT: http://realestate-system-jaeger:4318
      DEBUG: 'false'
      IDENTITY_MACHINE_CREDENTIALS_FILE: /machine-credentials/credentials.json
    depends_on:
      access-realestate-email-mock-email-db:
        condition: service_completed_successfully
      realestate-system-postgresql:
        condition: service_healthy
      realestate-system-jaeger:
        condition: service_healthy
      realestate-system-zitadel:
        condition: service_healthy
      realestate-system-zitadel-init:
        condition: service_completed_successfully
      realestate-email-mock-seed:
        condition: service_completed_successfully
    volumes:
    - ./config/identity/identity-providers.json:/app/config/identity/identity-providers.json:ro
    - realestate-system-machine-credentials:/machine-credentials:ro
    - ./config/services/realestate-email-mock/config-store.json:/app/config/config-store.json:ro
    secrets:
    - source: realestate-email-mock__email_db_password
      target: realestate_email_mock_email_db_rw_password
    cpu_shares: 1024
    healthcheck:
      test:
      - CMD-SHELL
      - wget --quiet --tries=1 --spider http://localhost:8092/ready || exit 1
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
    - backend
    - database
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  realestate-system-postgresql:
    image: postgres:17-alpine
    container_name: realestate-system-postgresql
    ports:
    - 127.0.0.1::5432
    environment:
      POSTGRES_DB: realestate_listing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${REALESTATE_SYSTEM_POSTGRESQL_POSTGRES_PASSWORD}
    volumes:
    - realestate-system-postgresql-data:/var/lib/postgresql/data
    - ./scripts/init-db/realestate-system-postgresql.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U $$POSTGRES_USER
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    cpu_shares: 1024
    networks:
    - database
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  realestate-system-kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: realestate-system-kafka
    ports:
    - 127.0.0.1:${REALESTATE_SYSTEM_KAFKA_HOST_PORT:-29092}:29092
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@realestate-system-kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://realestate-system-kafka:9092,EXTERNAL://localhost:${REALESTATE_SYSTEM_KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: '1'
      KAFKA_OFFSETS_TOPIC_SEGMENT_BYTES: '16777216'
      KAFKA_LOG_CLEANER_ENABLE: 'true'
      KAFKA_METADATA_LOG_SEGMENT_BYTES: '33554432'
      KAFKA_LOG_RETENTION_MS: '604800000'
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
    - realestate-system-kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
      - CMD-SHELL
      - kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 15s
      retries: 20
      start_period: 60s
    cpu_shares: 1024
    networks:
    - broker
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  realestate-listing-service-mq-init:
    image: confluentinc/cp-kafka:7.8.0
    container_name: realestate-listing-service-mq-init
    volumes:
    - ./scripts/init-topics:/scripts/init-topics:ro
    command:
    - /bin/bash
    - /scripts/init-topics/realestate-listing-service-mq.sh
    depends_on:
      realestate-system-kafka:
        condition: service_healthy
    healthcheck:
      disable: true
    cpu_shares: 1024
    networks:
    - broker
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  realestate-system-kafka-config-check:
    image: confluentinc/cp-kafka:7.8.0
    container_name: realestate-system-kafka-config-check
    volumes:
    - ./scripts/init-topics:/scripts/init-topics:ro
    command:
    - /bin/bash
    - /scripts/init-topics/realestate-system-kafka-broker-config.sh
    depends_on:
      realestate-system-kafka:
        condition: service_healthy
    healthcheck:
      disable: true
    cpu_shares: 1024
    networks:
    - broker
    restart: 'no'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  realestate-system-cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5@sha256:763aecf1c32c2be8a1a75f9abfc2fc461005c9dbbaa39cb356b354aac1296dbe
    container_name: realestate-system-cadvisor
    volumes:
    - /sys:/sys:ro
    - /proc:/rootfs/proc:ro
    - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    command:
    - --enable_metrics=app,cpu,cpuLoad,diskIO,memory,network,oom_event,percpu,perf_event
    - --docker=tcp://realestate-system-engine-api-proxy:2375
    depends_on:
      realestate-system-engine-api-proxy:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:8080/api/v1.3/docker/realestate-system-cadvisor
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpu_shares: 256
    networks:
    - engine-api
    - observability
    cap_add:
    - SYSLOG
    devices:
    - /dev/kmsg:/dev/kmsg:r
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  realestate-system-prometheus:
    image: prom/prometheus:v2.49.1@sha256:beb5e30ffba08d9ae8a7961b9a2145fc8af6296ff2a4f463df7cd722fcbfc789
    container_name: realestate-system-prometheus
    ports:
    - 127.0.0.1::9090
    volumes:
    - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./config/prometheus/rules:/etc/prometheus/rules:ro
    - prometheus-data:/prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:9090/-/healthy
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpu_shares: 256
    networks:
    - backend
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  realestate-system-jaeger:
    image: jaegertracing/all-in-one:1.53@sha256:60e65bfffe1f66aee96d6fc8b6bf65afd42016be5dcc09d2e15d8462f7d9409c
    container_name: realestate-system-jaeger
    ports:
    - 127.0.0.1::16686
    - 127.0.0.1::14268
    - 127.0.0.1::4318
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    volumes:
    - ./config/jaeger/sampling_strategies.json:/etc/jaeger/sampling_strategies.json:ro
    command:
    - --sampling.strategies-file=/etc/jaeger/sampling_strategies.json
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:14269/
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpu_shares: 256
    networks:
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  realestate-system-loki:
    image: grafana/loki:2.9.10@sha256:35b02acc67654ddc38273e519b4f26f3967a907b9db5489af300c21f37ee1ae7
    container_name: realestate-system-loki
    ports:
    - 127.0.0.1::3100
    volumes:
    - loki-data:/loki
    healthcheck:
      test:
      - CMD-SHELL
      - wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpu_shares: 256
    networks:
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  realestate-system-promtail:
    image: grafana/promtail:2.9.10@sha256:63a2e57a5b1401109f77d36a49a637889d431280ed38f5f885eedcd3949e52cf
    container_name: realestate-system-promtail
    ports:
    - 127.0.0.1::9080
    volumes:
    - ./config/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
    command:
    - -config.file=/etc/promtail/config.yml
    depends_on:
      realestate-system-loki:
        condition: service_healthy
      realestate-system-engine-api-proxy:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - bash
      - -c
      - 'exec 3<>/dev/tcp/127.0.0.1/9080 && printf "GET /ready HTTP/1.1\r\nHost: localhost\r\nConnection:
        close\r\n\r\n" >&3 && head -1 <&3 | grep -q "200 OK"'
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpu_shares: 256
    networks:
    - engine-api
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  realestate-system-engine-api-proxy:
    image: python:3.12-slim@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159
    container_name: realestate-system-engine-api-proxy
    volumes:
    - ./config/engine-api-proxy/engine_api_proxy.py:/opt/cruftfree/engine_api_proxy.py:ro
    - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
    - python
    - /opt/cruftfree/engine_api_proxy.py
    - serve
    healthcheck:
      test:
      - CMD
      - python
      - /opt/cruftfree/engine_api_proxy.py
      - probe
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    cpu_shares: 256
    networks:
    - engine-api
    cap_add:
    - NET_BIND_SERVICE
    cap_drop:
    - ALL
    read_only: true
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  realestate-system-alertmanager:
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    container_name: realestate-system-alertmanager
    ports:
    - 127.0.0.1::9093
    volumes:
    - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    healthcheck:
