services:
  realestate-listing-service:
    build:
      context: ./realestate_listing_service
      dockerfile: Dockerfile
    image: realestate-listing-service:latest
    container_name: realestate-listing-service
    ports:
    - 127.0.0.1::8001
    environment:
      PORT: '8001'
      SERVICE_NAME: realestate-listing-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://realestate-system-jaeger:4318
      DEBUG: 'false'
      IDENTITY_MACHINE_CREDENTIALS_FILE: /machine-credentials/credentials.json
    depends_on:
      access-realestate-listing-service-listing-db:
        condition: service_completed_successfully
      realestate-system-postgresql:
        condition: service_healthy
      realestate-system-kafka:
        condition: service_healthy
      realestate-listing-service-mq-init:
        condition: service_completed_successfully
      realestate-system-jaeger:
        condition: service_healthy
      realestate-system-zitadel:
        condition: service_healthy
      realestate-system-zitadel-init:
        condition: service_completed_successfully
      realestate-listing-service-seed:
        condition: service_completed_successfully
      realestate-system-kafka-config-check:
        condition: service_completed_successfully
    volumes:
    - ./config/identity/identity-providers.json:/app/config/identity/identity-providers.json:ro
    - realestate-system-machine-credentials:/machine-credentials:ro
    - ./config/services/realestate-listing-service/config-store.json:/app/config/config-store.json:ro
    secrets:
    - source: realestate-listing-service__listing_db_password
      target: realestate_listing_service_listing_db_rw_password
    cpu_shares: 1024
    healthcheck:
      test:
      - CMD-SHELL
      - wget --quiet --tries=1 --spider http://localhost:8001/ready || exit 1
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
    - backend
    - broker
    - database
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  realestate-viewing-service:
    build:
      context: ./realestate_viewing_service
      dockerfile: Dockerfile
    image: realestate-viewing-service:latest
    container_name: realestate-viewing-service
    ports:
    - 127.0.0.1::8002
    environment:
      PORT: '8002'
      SERVICE_NAME: realestate-viewing-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://realestate-system-jaeger:4318
      REALESTATE_LISTING_SERVICE_SERVICE_URL: http://realestate-listing-service:8001
      EMAIL_PROVIDER_SERVICE_URL: http://realestate-email-mock:8092
      email_provider_api_key: ${email_provider_api_key}
      DEBUG: 'false'
      IDENTITY_MACHINE_CREDENTIALS_FILE: /machine-credentials/credentials.json
    depends_on:
      access-realestate-viewing-service-viewing-db:
        condition: service_completed_successfully
      realestate-system-postgresql:
        condition: service_healthy
      realestate-system-kafka:
        condition: service_healthy
      realestate-system-jaeger:
        condition: service_healthy
      realestate-system-zitadel:
        condition: service_healthy
      realestate-system-zitadel-init:
        condition: service_completed_successfully
      realestate-viewing-service-seed:
        condition: service_completed_successfully
      realestate-system-kafka-config-check:
        condition: service_completed_successfully
    volumes:
    - ./config/identity/identity-providers.json:/app/config/identity/identity-providers.json:ro
    - realestate-system-machine-credentials:/machine-credentials:ro
    - ./config/services/realestate-viewing-service/config-store.json:/app/config/config-store.json:ro
    secrets:
    - source: realestate-viewing-service__viewing_db_password
      target: realestate_viewing_service_viewing_db_rw_password
    - source: realestate-viewing-service__email_provider_api_key
      target: email_provider_api_key
    cpu_shares: 1024
    healthcheck:
      test:
      - CMD-SHELL
      - wget --quiet --tries=1 --spider http://localhost:8002/ready || exit 1
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
    - backend
    - broker
    - database
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  realestate-deal-service:
    build:
      context: ./realestate_deal_service
      dockerfile: Dockerfile
    image: realestate-deal-service:latest
    container_name: realestate-deal-service
    ports:
    - 127.0.0.1::8003
    environment:
      PORT: '8003'
      SERVICE_NAME: realestate-deal-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://realestate-system-jaeger:4318
      REALESTATE_LISTING_SERVICE_SERVICE_URL: http://realestate-listing-service:8001
