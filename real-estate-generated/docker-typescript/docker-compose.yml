      mortgage_provider_api_key: ${mortgage_provider_api_key}
      SIGNATURE_PROVIDER_SERVICE_URL: http://realestate-signature-mock:8091
      signature_provider_api_key: ${signature_provider_api_key}
      EMAIL_PROVIDER_SERVICE_URL: http://realestate-email-mock:8092
      email_provider_api_key: ${email_provider_api_key}
      DEBUG: 'false'
      IDENTITY_MACHINE_CREDENTIALS_FILE: /machine-credentials/credentials.json
    depends_on:
      access-realestate-deal-service-deal-db:
        condition: service_completed_successfully
      realestate-system-postgresql:
        condition: service_healthy
      realestate-system-jaeger:
        condition: service_healthy
      realestate-system-zitadel:
        condition: service_healthy
      realestate-system-zitadel-init:
        condition: service_completed_successfully
      realestate-deal-service-seed:
        condition: service_completed_successfully
    volumes:
    - ./config/identity/identity-providers.json:/app/config/identity/identity-providers.json:ro
    - realestate-system-machine-credentials:/machine-credentials:ro
    - ./config/services/realestate-deal-service/config-store.json:/app/config/config-store.json:ro
    secrets:
    - source: realestate-deal-service__deal_db_password
      target: realestate_deal_service_deal_db_rw_password
    - source: realestate-deal-service__email_provider_api_key
      target: email_provider_api_key
    - source: realestate-deal-service__mortgage_provider_api_key
      target: mortgage_provider_api_key
    - source: realestate-deal-service__signature_provider_api_key
      target: signature_provider_api_key
    cpu_shares: 1024
    healthcheck:
      test:
      - CMD-SHELL
      - wget --quiet --tries=1 --spider http://localhost:8003/ready || exit 1
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
    - backend
    - database
    - observability
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  realestate-mortgage-mock:
    build:
      context: ./realestate_mortgage_mock
